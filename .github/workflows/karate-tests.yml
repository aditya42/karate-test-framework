name: Karate Automation Tests

on:
  push:
    branches: [ main, development ]
  pull_request:
    branches: [ main, development ]
  workflow_dispatch:
    inputs:
      environment:
        description: Karate environment
        required: true
        default: qa
        type: choice
        options:
          - local
          - qa
          - stage
      tags:
        description: Karate tag expression
        required: true
        default: '@api'
        type: string
      threads:
        description: Parallel threads
        required: true
        default: '4'
        type: string

permissions:
  contents: read

jobs:
  karate-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      KARATE_ENV: ${{ github.event.inputs.environment || 'qa' }}
      KARATE_TAGS: ${{ github.event.inputs.tags || '@api' }}
      KARATE_THREADS: ${{ github.event.inputs.threads || '4' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Run Karate tests
        run: >-
          mvn -B clean test
          -Dkarate.env="${KARATE_ENV}"
          -Dkarate.threads="${KARATE_THREADS}"
          -Dkarate.options="--tags ${KARATE_TAGS}"

      - name: Upload Karate reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: karate-reports-${{ github.run_number }}
          path: |
            target/karate-reports/**
            target/surefire-reports/**
          if-no-files-found: warn
          retention-days: 14
